# V0.2 生产入口：公开访问。
# 复制到 /etc/nginx/sites-available/meteo-resource-platform.conf 后启用。
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/meteo-resource-platform;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 平台 API：只允许通过 Nginx 进入，应用服务监听回环地址。
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Open-Meteo：保留 /v1 路径，避免公开 Docker 端口。
    location /open-meteo/ {
        rewrite ^/open-meteo/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
    }
}
