# V0.2 生产入口：白名单 IP 直接访问，其他来源使用 Basic Auth。
# 复制到 /etc/nginx/sites-available/meteo-resource-platform.conf 后启用。
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/meteo-resource-platform;
    index index.html;

    # 白名单来源免认证；其他来源必须通过 Basic Auth。
    satisfy any;
    allow 39.105.228.11;
    deny all;
    auth_basic "气象资源空间智能平台";
    auth_basic_user_file /etc/nginx/.htpasswd-meteo;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 平台 API：只允许通过 Nginx 进入，应用服务监听回环地址。
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Open-Meteo：保留 /v1 路径，避免公开 Docker 端口。
    location /open-meteo/ {
        rewrite ^/open-meteo/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000/health;
    }
}
